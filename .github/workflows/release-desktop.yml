name: Build Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  DEFAULT_BACKEND_URL: ${{ vars.DEFAULT_BACKEND_URL }}
  RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            arch: x64
          - platform: macos-x64
            os: macos-latest
            arch: x64
          - platform: macos-arm64
            os: macos-latest
            arch: arm64
          - platform: linux-x64
            os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release configuration
        run: |
          pnpm run configure:default
          node scripts/write-release-version.js

      - name: Validate target release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY"
        shell: pwsh

      - name: Build desktop installer
        run: |
          pnpm run build
          pnpm exec electron-forge make --arch ${{ matrix.arch }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: out/make/**/*
          if-no-files-found: error

  publish:
    name: Attach installers to release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-upload
          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            release_name="${filename//虚拟数据中心原位调度子系统/virtual-data-center}"
            target="release-upload/$release_name"
            if [[ -e "$target" ]]; then
              echo "Duplicate release asset name: $release_name" >&2
              exit 1
            fi
            cp "$file" "$target"
          done < <(find release-assets -type f -print0)
          cd release-upload
          sha256sum * > SHA256SUMS.txt
          gh release upload "$RELEASE_VERSION" ./* --repo "$GITHUB_REPOSITORY" --clobber
