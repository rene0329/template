apiVersion: apps/v1
kind: Deployment
metadata:
  name: topic4-1-frontend
  namespace: mdc
  labels:
    app: topic4-1-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: topic4-1-frontend
  template:
    metadata:
      labels:
        app: topic4-1-frontend
    spec:
      containers:
        - name: topic4-1-frontend
          image: 10.15.16.40:30455/topic4-frontend:v-41df066d5a09d3131b379cd37065da531f7021ee
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
