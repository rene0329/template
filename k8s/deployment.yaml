apiVersion: apps/v1
kind: Deployment
metadata:
  name: fangcang-front
  namespace: topic4-1
  labels:
    app: fangcang-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fangcang-front
  template:
    metadata:
      labels:
        app: fangcang-front
    spec:
      containers:
        - name: fangcang-front
          image: ghcr.io/rene0329/template:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
